<!DOCTYPE html>
<html>

<head>
    <title>Agent Audio Test</title>
</head>

<body>
    <button id="connect">Connect</button>
    <button id="startAudio">Start Audio</button>

    <script>
        const WS_URL =
            "wss://agentserver-662251767689.asia-south1.run.app/mynimi/?boss_emp_id=1001";

        let ws;
        let audioContext;
        let processor;
        let micStream;

        document.getElementById("connect").onclick = () => {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log("CONNECTED");
                ws.send(JSON.stringify({
                    type: "text",
                    data: "Hello agent, starting audio test"
                }));
            };

            ws.onmessage = (e) => {
                console.log("FROM AGENT:", e.data);
            };

            ws.onerror = (e) => console.error("WS ERROR", e);
        };

        document.getElementById("startAudio").onclick = async () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("Connect WS first");
                return;
            }

            console.log("Requesting mic access…");

            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

            audioContext = new AudioContext({ sampleRate: 16000 });
            await audioContext.resume();

            const source = audioContext.createMediaStreamSource(micStream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);

            source.connect(processor);
            processor.connect(audioContext.destination);

            processor.onaudioprocess = (e) => {
                if (ws.readyState !== WebSocket.OPEN) return;

                const input = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(input.length);

                for (let i = 0; i < input.length; i++) {
                    const s = Math.max(-1, Math.min(1, input[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
                }

                // Base64 encode (same as your React app)
                const bytes = new Uint8Array(pcm16.buffer);
                let binary = "";
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }

                const base64Audio = btoa(binary);

                ws.send(JSON.stringify({
                    type: "audio",
                    data: base64Audio
                }));
            };

            console.log("🎤 Audio streaming started — speak now");
        };
    </script>
</body>

</html>
